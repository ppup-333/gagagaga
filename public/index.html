<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欠錢記帳本</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background: #f0f3f8; 
            margin: 0; 
            padding: 20px 12px; 
            color: #2d3748; 
        }
        .container { 
            max-width: 620px; 
            margin: 0 auto; 
            background: #ffffff; 
            padding: 24px 20px; 
            border-radius: 14px; 
            box-shadow: 0 4px 18px rgba(0,0,0,0.06); 
        }
        h2 { text-align: center; color: #2b6cb0; margin-top: 0; margin-bottom: 20px; }
        .hidden { display: none !important; }
        
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #4a5568; font-size: 14px; }
        
        input[type="text"], input[type="number"], input[type="password"], select, textarea { 
            width: 100%; 
            padding: 10px 12px; 
            border: 1.5px solid #e2e8f0; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 15px;
            background-color: #fff;
            color: #2d3748;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        select { cursor: pointer; }
        textarea { 
            resize: vertical; 
            min-height: 70px; 
            line-height: 1.5; 
        }
        select:focus, input:focus, textarea:focus { 
            outline: none; 
            border-color: #3182ce; 
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2); 
        }
        
        .btn { 
            background: #3182ce; 
            color: white; 
            border: none; 
            padding: 11px 16px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 16px; 
            font-weight: 600; 
            transition: background 0.2s, transform 0.1s; 
        }
        .btn:hover { background: #2b6cb0; }
        .btn:active { transform: translateY(1px); }

        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .header-flex h2 { margin: 0; text-align: left; font-size: 22px; color: #1a202c; }
        .logout-btn { 
            background: #e53e3e; 
            width: auto; 
            padding: 6px 14px; 
            font-size: 13px; 
            border-radius: 6px;
            border: none;
            color: white;
            cursor: pointer;
        }
        .logout-btn:hover { background: #c53030; }
        
        .user-status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #718096;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #edf2f7;
        }
        .badge { 
            display: inline-block; 
            padding: 3px 10px; 
            border-radius: 20px; 
            background: #ebf8ff; 
            color: #2b6cb0; 
            font-size: 13px; 
            font-weight: 600; 
        }

        /* 句子式記帳表單區塊 */
        .sentence-card {
            background: #f7fafc;
            border: 1.5px solid #edf2f7;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .sentence-inline-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 14px;
        }
        .sentence-select {
            flex: 1 1 110px;
            min-width: 90px;
            font-weight: bold;
            color: #2b6cb0;
            background-color: #ffffff;
        }
        .sentence-amount {
            flex: 1 1 100px;
            min-width: 85px;
            font-weight: bold;
            color: #c53030;
        }
        .sentence-connect {
            white-space: nowrap;
            color: #4a5568;
            font-weight: 600;
        }
        
        /* 換行顯示的項目區塊 */
        .sentence-note-row {
            margin-top: 10px;
        }
        .sentence-item-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #4a5568;
            font-size: 15px;
        }

        /* 帳目卡片 */
        .item-card { 
            background: #ffffff; 
            border: 1.5px solid #edf2f7; 
            padding: 14px 16px; 
            border-radius: 10px; 
            margin-bottom: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start;
            gap: 12px;
            transition: all 0.2s;
        }
        .item-card.settled { 
            background: #f0fff4; 
            border-color: #c6f6d5; 
            opacity: 0.75;
        }
        .item-card.settled .statement-main,
        .item-card.settled .statement-item-line { 
            text-decoration: line-through; 
            color: #718096; 
        }
        .item-content { flex: 1; word-break: break-word; }
        
        /* 列表第一行：誰要給誰多少元 */
        .statement-main {
            font-size: 15px;
            line-height: 1.6;
            color: #2d3748;
            margin-bottom: 6px;
        }
        /* 列表第二行：換行從第一個字開始顯示項目 */
        .statement-item-line {
            font-size: 14.5px;
            line-height: 1.6;
            color: #4a5568;
            margin-bottom: 8px;
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 6px;
        }
        .item-lead-text {
            font-weight: 600;
            color: #4a5568;
            white-space: nowrap;
        }
        
        .user-tag {
            display: inline-block;
            background: #ebf8ff;
            color: #2b6cb0;
            padding: 1px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        .amount-tag {
            color: #e53e3e;
            font-weight: 800;
            font-size: 16px;
            margin: 0 2px;
        }
        /* 醒目的項目標籤樣式 */
        .note-tag {
            display: inline-block;
            background: #fffbeb;
            color: #92400e;
            border: 1px solid #fde68a;
            padding: 2px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            word-break: break-word;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }
        .item-card.settled .note-tag {
            background: #edf2f7;
            color: #718096;
            border-color: #e2e8f0;
        }
        .meta { 
            font-size: 12px; 
            color: #a0aec0; 
        }
        
        /* 結清核取方塊樣式 */
        .settle-check {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            color: #4a5568;
            user-select: none;
            white-space: nowrap;
            padding: 4px 8px;
            border-radius: 6px;
            background: #f7fafc;
            border: 1px solid #edf2f7;
            transition: all 0.2s;
        }
        .settle-check:hover:not(.disabled) {
            background: #edf2f7;
            border-color: #cbd5e0;
        }
        .settle-check input { cursor: pointer; width: 16px; height: 16px; margin: 0; }
        
        /* 非相關成員不可點擊樣式 */
        .settle-check.disabled {
            opacity: 0.45;
            cursor: not-allowed;
            background: #edf2f7;
            border-color: #e2e8f0;
        }
        .settle-check.disabled input {
            cursor: not-allowed;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 登入畫面 -->
    <div id="login-section">
        <h2>欠錢記帳本</h2>
        <div class="form-group">
            <label for="room-select">1. 選擇記帳空間</label>
            <select id="room-select" onchange="onRoomChange()">
                <option value="" disabled selected>載入中...</option>
            </select>
        </div>
        <div class="form-group">
            <label for="user-select">2. 選擇成員身分</label>
            <select id="user-select">
                <option value="" disabled selected>請先選擇記帳空間</option>
            </select>
        </div>
        <div class="form-group">
            <label for="room-password">3. 空間密碼</label>
            <input type="password" id="room-password" placeholder="請輸入該空間密碼" onkeydown="if(event.key==='Enter') login()">
        </div>
        <button class="btn" onclick="login()">進入記帳本</button>
    </div>

    <!-- 記帳主畫面 -->
    <div id="app-section" class="hidden">
        <div class="header-flex">
            <h2 id="current-room-title">欠錢記帳本</h2>
            <button class="logout-btn" onclick="logout()">登出</button>
        </div>
        
        <div class="user-status-bar">
            <span>空間：<span id="current-room-display" class="badge"></span></span>
            <span>・</span>
            <span>目前身分：<strong id="current-user-display" style="color: #2d3748;"></strong></span>
        </div>
        
        <!-- 句子式記帳表單（項目換行自首字起顯示） -->
        <div class="sentence-card">
            <div class="sentence-inline-row">
                <select id="from-user-select" class="sentence-select" title="付款人"></select>
                <span class="sentence-connect">要給</span>
                <select id="to-user-select" class="sentence-select" title="收款人"></select>
                <input type="number" id="amount" class="sentence-amount" placeholder="金額" min="1">
                <span class="sentence-connect">元</span>
            </div>
            
            <div class="sentence-note-row">
                <label for="note" class="sentence-item-label">項目是：</label>
                <textarea id="note" placeholder="請輸入項目說明（不限字數，例如：代買午餐、宵夜、高鐵票...）"></textarea>
            </div>
        </div>
        <button class="btn" onclick="addAccount()">新增一筆帳</button>

        <hr style="margin: 24px 0 16px 0; border: 0; border-top: 1px solid #edf2f7;">
        
        <h3 style="margin-bottom: 14px; color: #2d3748; font-size: 17px;">帳目列表</h3>
        <div id="accounts-list">載入中...</div>
    </div>
</div>

<script>
    let roomsData = [];
    let currentRoomId = '';
    let currentRoomName = '';
    let currentUser = '';

    window.onload = async () => {
        await fetchRooms();
        const savedRoomId = localStorage.getItem('accounting_room_id');
        const savedRoomName = localStorage.getItem('accounting_room_name');
        const savedUser = localStorage.getItem('accounting_user');
        const isAuth = localStorage.getItem('accounting_auth');

        if (savedRoomId && savedUser && isAuth === 'true') {
            currentRoomId = savedRoomId;
            currentRoomName = savedRoomName || '欠錢記帳本';
            currentUser = savedUser;
            showApp();
        }
    };

    async function fetchRooms() {
        try {
            const res = await fetch('/api/rooms');
            roomsData = await res.json();
            const roomSelect = document.getElementById('room-select');
            
            if (!roomsData || roomsData.length === 0) {
                roomSelect.innerHTML = '<option value="" disabled>目前無可用空間</option>';
                return;
            }

            roomSelect.innerHTML = roomsData.map(r => `<option value="${r.id}">${escapeHtml(r.name)}</option>`).join('');
            onRoomChange();
        } catch (err) {
            console.error('載入空間清單失敗', err);
            document.getElementById('room-select').innerHTML = '<option value="" disabled>無法載入空間</option>';
        }
    }

    function onRoomChange() {
        const roomSelect = document.getElementById('room-select');
        const selectedRoomId = roomSelect.value;
        const room = roomsData.find(r => r.id === selectedRoomId);
        const userSelect = document.getElementById('user-select');

        if (room && room.members && room.members.length > 0) {
            userSelect.innerHTML = room.members.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
        } else {
            userSelect.innerHTML = '<option value="" disabled>無可用成員</option>';
        }
    }

    function updateFormMemberSelectors() {
        const room = roomsData.find(r => r.id === currentRoomId);
        if (!room || !room.members) return;

        const fromSelect = document.getElementById('from-user-select');
        const toSelect = document.getElementById('to-user-select');

        const optionsHtml = room.members.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
        fromSelect.innerHTML = optionsHtml;
        toSelect.innerHTML = optionsHtml;

        // 預設付款人為當前登入者
        if (room.members.includes(currentUser)) {
            fromSelect.value = currentUser;
        }

        // 預設收款人為另一位成員（若有）
        const otherMember = room.members.find(m => m !== currentUser);
        if (otherMember) {
            toSelect.value = otherMember;
        }
    }

    async function login() {
        const roomId = document.getElementById('room-select').value;
        const user = document.getElementById('user-select').value;
        const password = document.getElementById('room-password').value.trim();

        if (!roomId || !user) {
            alert('請選擇空間與成員身分！');
            return;
        }

        if (!password) {
            alert('請輸入空間密碼！');
            return;
        }

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roomId, user, password })
            });
            const data = await res.json();

            if (data.success) {
                currentRoomId = data.roomId;
                currentRoomName = data.roomName;
                currentUser = data.user;
                localStorage.setItem('accounting_room_id', currentRoomId);
                localStorage.setItem('accounting_room_name', currentRoomName);
                localStorage.setItem('accounting_user', currentUser);
                localStorage.setItem('accounting_auth', 'true');
                document.getElementById('room-password').value = '';
                showApp();
            } else {
                alert(data.message || '登入失敗');
            }
        } catch (err) {
            alert('網路或伺服器連線異常，請稍後再試！');
        }
    }

    function logout() {
        localStorage.removeItem('accounting_room_id');
        localStorage.removeItem('accounting_room_name');
        localStorage.removeItem('accounting_user');
        localStorage.removeItem('accounting_auth');
        currentRoomId = '';
        currentRoomName = '';
        currentUser = '';

        document.getElementById('app-section').classList.add('hidden');
        document.getElementById('login-section').classList.remove('hidden');
        document.getElementById('room-password').value = '';
    }

    function showApp() {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('app-section').classList.remove('hidden');
        document.getElementById('current-room-title').innerText = currentRoomName;
        document.getElementById('current-room-display').innerText = currentRoomName;
        document.getElementById('current-user-display').innerText = currentUser;
        updateFormMemberSelectors();
        loadAccounts();
    }

    async function loadAccounts() {
        try {
            const res = await fetch(`/api/accounts?roomId=${encodeURIComponent(currentRoomId)}`);
            const accounts = await res.json();

            const listDiv = document.getElementById('accounts-list');
            if (!Array.isArray(accounts) || accounts.length === 0) {
                listDiv.innerHTML = '<p style="text-align:center; color:#a0aec0; padding: 24px 0;">此空間目前沒有任何帳目紀錄</p>';
                return;
            }

            listDiv.innerHTML = accounts.map(item => {
                const from = item.fromUser || item.user;
                const to = item.toUser || '';
                const noteText = item.note || '無備註';
                
                // 檢查當前登入者是否為該筆帳目的相關兩位成員之一
                const isRelevant = (currentUser === from || currentUser === to);

                const statementMainHtml = to 
                    ? `<span class="user-tag">${escapeHtml(from)}</span> 要給 <span class="user-tag">${escapeHtml(to)}</span> <span class="amount-tag">${item.amount}</span> 元`
                    : `<span class="user-tag">${escapeHtml(from)}</span> 記了一筆 <span class="amount-tag">$${item.amount}</span>`;

                const checkboxHtml = isRelevant
                    ? `<label class="settle-check" title="點擊切換結清狀態">
                           <input type="checkbox" ${item.settled ? 'checked' : ''} onchange="toggleSettled('${item.id}', this.checked)"> 已結清
                       </label>`
                    : `<label class="settle-check disabled" title="只有相關的兩位成員（${escapeHtml(from)} 或 ${escapeHtml(to)}）可以變更結清狀態">
                           <input type="checkbox" ${item.settled ? 'checked' : ''} disabled> 已結清
                       </label>`;

                return `
                    <div class="item-card ${item.settled ? 'settled' : ''}">
                        <div class="item-content">
                            <div class="statement-main">${statementMainHtml}</div>
                            <div class="statement-item-line">
                                <span class="item-lead-text">項目是：</span>
                                <span class="note-tag">🏷️ ${escapeHtml(noteText)}</span>
                            </div>
                            <div class="meta">記錄者：${escapeHtml(item.user)} ｜ ${escapeHtml(item.time)}</div>
                        </div>
                        <div>
                            ${checkboxHtml}
                        </div>
                    </div>
                `;
            }).join('');
        } catch (err) {
            document.getElementById('accounts-list').innerHTML = '<p style="text-align:center; color:#e53e3e;">載入帳目失敗，請重新整理頁面</p>';
        }
    }

    async function addAccount() {
        const fromUser = document.getElementById('from-user-select').value;
        const toUser = document.getElementById('to-user-select').value;
        const amountInput = document.getElementById('amount');
        const noteInput = document.getElementById('note');
        const amount = amountInput.value.trim();
        const note = noteInput.value.trim();

        if (!amount || Number(amount) <= 0) {
            alert('請填寫正確的金額！');
            amountInput.focus();
            return;
        }

        if (fromUser === toUser) {
            alert('付款人與收款人不能是同一位成員！');
            return;
        }

        try {
            const res = await fetch('/api/accounts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    roomId: currentRoomId, 
                    user: currentUser, 
                    fromUser, 
                    toUser, 
                    amount, 
                    note 
                })
            });
            const data = await res.json();

            if (data.success) {
                amountInput.value = '';
                noteInput.value = '';
                loadAccounts();
            } else {
                alert(data.message || '新增失敗');
            }
        } catch (err) {
            alert('新增失敗，請檢查網路連線');
        }
    }

    async function toggleSettled(id, settled) {
        try {
            const res = await fetch(`/api/accounts/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ settled, currentUser })
            });
            const data = await res.json();
            if (!data.success) {
                alert(data.message || '更新狀態失敗');
            }
            loadAccounts();
        } catch (err) {
            alert('更新狀態失敗，請檢查網路連線');
            loadAccounts();
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.toString().replace(/[&<>"']/g, m => map[m]);
    }
</script>

</body>
</html>
